<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng của tôi - THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/customer/order.css}"/>
    <link rel="stylesheet" th:href="@{/css/customer/head.css}">
</head>
<body>

<header th:replace="~{fragments/customer/header::header}"></header>

<div class="container mt-3">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <strong th:text="${errorMessage}">Nội dung lỗi sẽ hiện ở đây</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <strong th:text="${successMessage}">Nội dung thành công sẽ hiện ở đây</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div class="container py-5" style="max-width: 900px;">
    <h3 class="fw-bold mb-4 text-custom-blue">
        <i class="fa-solid fa-clipboard-list me-2"></i> Đơn hàng của tôi
    </h3>

    <div th:if="${#lists.isEmpty(orders)}" class="text-center bg-white p-5 rounded shadow-sm">
        <i class="fa-solid fa-box-open fs-1 text-muted mb-3"></i>
        <h5 class="text-muted">Bạn chưa có đơn hàng nào!</h5>
        <a href="/" class="btn btn-primary mt-3 px-4 rounded-pill">Tiếp tục mua sắm</a>
    </div>

    <div th:each="order : ${orders}" class="card order-card">

        <div class="order-header d-flex justify-content-between align-items-center">
            <div>
                <span class="fw-bold text-dark fs-5">Mã đơn: #<span th:text="${order.id}"></span></span>
                <span class="text-muted ms-3" style="font-size: 14px;">
                    <i class="fa-regular fa-clock me-1"></i>
                    <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span>
                </span>
            </div>

            <span class="badge badge-status"
                  th:classappend="${order.status == 'PENDING' ? 'bg-warning text-dark' :
                                  (order.status == 'SHIPPING' ? 'bg-info text-white' :
                                  (order.status == 'COMPLETED' ? 'bg-success text-white' : 'bg-danger text-white'))}"
                  th:text="${order.status == 'PENDING' ? 'Chờ xác nhận' :
                           (order.status == 'SHIPPING' ? 'Đang giao hàng' :
                           (order.status == 'COMPLETED' ? 'Đã giao thành công' : 'Đã hủy'))}">
            </span>
        </div>

        <div class="card-body px-4 py-2">
            <div th:each="detail : ${order.orderDetails}" class="product-item d-flex align-items-center">
                <img th:src="${detail.variants.product.mainImage != null ? detail.variants.product.mainImage : 'https://via.placeholder.com/80'}"
                     class="rounded border me-3" style="width: 80px; height: 80px; object-fit: contain;" alt="Hình sản phẩm">

                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-1" th:text="${detail.variants.product.name}">Tên sản phẩm</h6>

                    <div class="text-muted mb-1" style="font-size: 13px;">
                        Phân loại:
                        <span th:each="attr, stat : ${detail.variants.attributes}"
                              th:text="${attr.value} + (!${stat.last} ? ' - ' : '')"></span>
                    </div>

                    <div>
                        <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
                        <span class="text-muted ms-2">x <span th:text="${detail.quantity}"></span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="total-row d-flex justify-content-end align-items-center mt-2">
            <span class="text-secondary me-3">Thành tiền:</span>
            <span class="fs-4 fw-bold text-danger me-4" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
            <form th:if="${order.status == 'PENDING'}" th:action="@{/cancel-order}" method="post" class="me-2" onsubmit="return confirm('Bạn có chắc chắn muốn hủy đơn hàng này không?');">
                <input type="hidden" name="id" th:value="${order.id}" />
                <button type="submit" class="btn btn-outline-danger rounded-pill px-4">
                    Hủy đơn
                </button>
            </form>
            <a th:href="@{/order-detail(id=${order.id})}" class="btn btn-outline-primary rounded-pill px-4">
                Xem chi tiết
            </a>
        </div>

    </div>
</div>
<div th:replace="~{fragments/customer/footer::footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
