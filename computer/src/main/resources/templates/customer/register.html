<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow rounded-4 border-0 p-4">
        <h2 class="text-center text-primary fw-bold mb-4">📝 Đăng ký Khách hàng</h2>

        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerDto}" method="post">

            <h5 class="text-muted mb-3 border-bottom pb-2">Thông tin đăng nhập</h5>
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập:</label>
                <input type="text" class="form-control" th:field="*{username}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu:</label>
                <input type="password" class="form-control" th:field="*{password}" required>
            </div>

            <h5 class="text-muted mt-4 mb-3 border-bottom pb-2">Thông tin liên hệ</h5>
            <div class="mb-3">
                <label class="form-label fw-bold">Họ và Tên:</label>
                <input type="text" class="form-control" th:field="*{fullName}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Số điện thoại:</label>
                <input type="text" class="form-control" th:field="*{phone}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Đăng ký ngay</button>

            <div class="text-center mt-3">
                Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none">Đăng nhập tại đây</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
