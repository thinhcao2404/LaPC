<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi Mật Khẩu - THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/customer/change-password.css}"/>
    <link rel="stylesheet" th:href="@{/css/customer/head.css}">
</head>
<body>

<header th:replace="~{fragments/customer/header :: header}"></header>

<div class="container">
    <div class="password-container">
        <h3 class="fw-bold mb-4 text-center">Đổi Mật Khẩu</h3>

        <form th:action="@{/change-password}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Mật khẩu hiện tại</label>
                <input type="password" name="oldPassword" class="form-control form-control-custom" placeholder="Nhập mật khẩu cũ..." required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Mật khẩu mới</label>
                <input type="password" name="newPassword" class="form-control form-control-custom" placeholder="Nhập mật khẩu mới..." required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Xác nhận mật khẩu mới</label>
                <input type="password" name="confirmPassword" class="form-control form-control-custom" placeholder="Nhập lại mật khẩu mới..." required>
            </div>

            <button type="submit" class="btn btn-blue">CẬP NHẬT MẬT KHẨU</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/customer/footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        var successMessage = /*[[${successMessage}]]*/ null;
        var errorMessage = /*[[${errorMessage}]]*/ null;

        // Popup báo Thành công (Màu xanh)
        if (successMessage) {
            Swal.fire({
                icon: 'success',
                title: 'Thành công!',
                text: successMessage,
                timer: 2500,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }

        // Popup báo Lỗi (Màu đỏ)
        if (errorMessage) {
            Swal.fire({
                icon: 'error',
                title: 'Thất bại!',
                text: errorMessage,
                timer: 3000,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }
    });
</script>
</body>
</html>
