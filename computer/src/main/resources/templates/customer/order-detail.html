<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng #[[${order.id}]] - THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/customer/order.css}"/>
    <link rel="stylesheet" th:href="@{/css/customer/head.css}">
</head>
<body class="bg-light">

<header th:replace="~{fragments/customer/header::header}"></header>

<div class="container py-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-custom-blue m-0">
            <i class="fa-solid fa-circle-info me-2"></i> Chi tiết đơn hàng </span>
        </h3>
        <a href="/order" class="btn btn-outline-secondary rounded-pill">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
        </a>
    </div>

    <div class="card shadow-sm mb-4 border-0">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-location-dot text-danger me-2"></i> Thông tin nhận hàng</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p class="mb-2"><span class="text-muted">Người nhận:</span> <strong th:text="${order.customerName}"></strong></p>
                    <p class="mb-2"><span class="text-muted">Điện thoại:</span> <strong th:text="${order.shippingPhone}"></strong></p>
                </div>
                <div class="col-md-6">
                    <p class="mb-2"><span class="text-muted">Địa chỉ:</span> <strong th:text="${order.shippingAddress}"></strong></p>
                    <p class="mb-2"><span class="text-muted">Ghi chú:</span> <span th:text="${order.note}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-box text-primary me-2"></i> Sản phẩm đã đặt</h5>
            <div th:each="detail : ${order.orderDetails}" class="d-flex align-items-center p-3 border-bottom">
                <img th:src="${detail.mainImage != null ? detail.mainImage : 'https://via.placeholder.com/80'}"
                     class="rounded border me-3" style="width: 80px; height: 80px; object-fit: contain;" alt="Hình sản phẩm">

                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-1" th:text="${detail.productName}">Tên sản phẩm</h6>
                    <div class="text-muted mb-1" style="font-size: 13px;">
                        Cấu hình:
                        <span th:each="attr, stat : ${detail.attributesString}"></span>
                    </div>
                    <div>
                        <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
                        <span class="text-muted ms-2">x <span th:text="${detail.quantity}"></span></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body p-0">

        </div>
        <div class="card-footer bg-white text-end py-3">
            <span class="text-muted me-3">Tổng cộng:</span>
            <span class="fs-4 fw-bold text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
        </div>
    </div>
</div>
<div th:replace="~{fragments/customer/footer::footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
