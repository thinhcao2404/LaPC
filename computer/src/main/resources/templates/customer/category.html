<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh mục sản phẩm - THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/category.css}"/>
</head>
<body class="bg-light">

<header th:replace="~{fragments/header::header}"></header>

<div class="container mt-4 mb-5">
    <div class="row g-4">

        <div class="col-lg-3">
            <div class="bg-white rounded shadow-sm category-menu h-100">
                <a th:each="cat : ${categoryList}"
                   th:href="@{/category/{id}(id=${cat.id})}"
                   th:classappend="${category != null and category.id == cat.id} ? 'active' : ''">

                    <i class="fa-solid fa-folder me-3" style="width: 15px; text-align: center;"></i>
                    <span th:text="${cat.name}">Tên danh mục</span>
                    <i class="fa-solid fa-chevron-right ms-auto" style="font-size: 10px;"></i>
                </a>
            </div>
        </div>

        <div class="col-lg-9">

            <div class="bg-white rounded shadow-sm p-3 mb-4 d-flex align-items-center">
                <h4 class="m-0 fw-bold text-custom-blue">
                    <i class="fa-solid fa-tag me-2 text-warning"></i>
                    Danh mục: <span th:text="${category != null ? category.name : 'Đang tải...'}">Tên Danh Mục</span>
                </h4>
            </div>

            <div th:if="${#lists.isEmpty(productList)}" class="alert alert-warning text-center shadow-sm py-5">
                <i class="fa-solid fa-box-open fs-1 mb-3 text-muted"></i>
                <p class="fs-5 mb-0">Xin lỗi, hiện chưa có sản phẩm nào thuộc danh mục này.</p>
                <a href="/static" class="btn btn-outline-primary mt-3">Quay lại Trang chủ</a>
            </div>

            <div th:unless="${#lists.isEmpty(productList)}" class="row g-3">
                <div class="col-lg-4 col-md-6" th:each="p : ${productList}">
                    <div class="card h-100 shadow-sm border-0 product-card">

                        <a th:href="@{/product/detail(id=${p.id})}" class="text-decoration-none text-dark d-flex flex-column h-100">
                            <img th:src="${p.mainImage != null ? p.mainImage : 'https://via.placeholder.com/300x300?text=NO+IMAGE'}"
                                 class="card-img-top p-3" alt="Hình sản phẩm">

                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title fw-bold mb-3" th:text="${p.name}">Tên sản phẩm</h6>

                                <p class="text-danger fw-bold fs-5 mb-0 mt-auto">
                                    Giá: Xem chi tiết
                                </p>
                            </div>
                        </a>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<div th:replace="~{fragments/footer::footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
