<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Trang chủ - Cửa hàng Máy Tính</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="/js/cart.js"></script>
    <link rel="stylesheet" th:href="@{/css/customer/index.css}">
    <link rel="stylesheet" th:href="@{/css/customer/menu.css}">
    <link rel="stylesheet" th:href="@{/css/customer/head.css}">

    <style>
        @media (max-width: 768px) {
            .banner-container {
                --bs-aspect-ratio: 45% !important; /* Tăng chiều cao banner để không bị dẹt */
            }
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/customer/header::header}"></div>

<div class="container mt-4 mb-5 overflow-hidden">
    <div class="row g-3">

        <div th:replace="~{fragments/customer/menu::menu}"></div>

        <div class="col-lg-9 col-md-12">
            <div class="d-flex flex-column gap-3 h-100">

                <div class="row g-3">
                    <div class="col-12">
                        <div class="banner-container ratio rounded shadow-sm overflow-hidden" style="--bs-aspect-ratio: 35%;">
                            <img th:src="@{/images/thinhpc-banner-main.png}" alt="Banner Chính" class="img-fluid w-100 h-100" style="object-fit: cover;">
                        </div>
                    </div>
                </div>

                <div class="row g-2 g-md-3">
                    <div class="col-lg-4 col-md-6 col-6">
                        <div class="banner-container ratio rounded shadow-sm overflow-hidden" style="--bs-aspect-ratio: 40%;">
                            <img th:src="@{/images/banner.jpg}" alt="Banner đáy 1" class="img-fluid w-100 h-100" style="object-fit: cover;">
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-6 col-6">
                        <div class="banner-container ratio rounded shadow-sm overflow-hidden" style="--bs-aspect-ratio: 40%;">
                            <img th:src="@{/images/banner.jpg}" alt="Banner đáy 2" class="img-fluid w-100 h-100" style="object-fit: cover;">
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12 d-none d-lg-block">
                        <div class="banner-container ratio rounded shadow-sm overflow-hidden" style="--bs-aspect-ratio: 40%;">
                            <img th:src="@{/images/banner.jpg}" alt="Banner đáy 3" class="img-fluid w-100 h-100" style="object-fit: cover;">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div class="container mt-4 mb-5" th:each="cat : ${featuredCategories}">

    <div class="bg-white p-2 p-md-3 rounded shadow-sm border-top border-primary border-3">

        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
            <h4 class="fw-bold text-custom-blue m-0 text-uppercase fs-5 fs-md-4" th:text="${cat.name}">TÊN DANH MỤC</h4>
            <a th:href="@{/category/{id}(id=${cat.id})}" class="text-decoration-none text-primary fw-bold" style="font-size: 0.9rem;">
                Xem tất cả <i class="fa-solid fa-angle-right ms-1"></i>
            </a>
        </div>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-2 g-md-3">

            <div class="col" th:each="p : ${cat.products}">
                <div class="card h-100 shadow-sm border-light product-card p-1 p-md-2 transition-all">

                    <a th:href="@{/product/detail(id=${p.id})}" class="text-decoration-none d-block text-center">
                        <img th:src="${p.mainImage != null ? p.mainImage : 'https://via.placeholder.com/300x300'}"
                             class="card-img-top img-fluid p-2" alt="Sản phẩm" style="object-fit: contain; aspect-ratio: 1/1; max-height: 200px;">
                    </a>

                    <div class="card-body d-flex flex-column p-2">
                        <h6 class="card-title text-dark fw-bold text-truncate-2 mb-2" style="font-size: 0.85rem; min-height: 2.5rem;" th:text="${p.name}">
                            Tên sản phẩm mẫu
                        </h6>
                        <div class="text-danger fw-bold mt-auto" style="font-size: 1rem;">
                            <span th:if="${not #lists.isEmpty(p.variants)}" th:text="${#numbers.formatDecimal(p.variants[0].price, 0, 'COMMA', 0, 'POINT')}">0</span>
                            <span th:if="${#lists.isEmpty(p.variants)}">Liên hệ</span> đ
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/customer/footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
