<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh mục sản phẩm - THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/customer/category.css}"/>
    <link rel="stylesheet" th:href="@{/css/customer/head.css}"/>
    <link rel="stylesheet" th:href="@{/css/customer/menu.css}"/>

</head>
<body class="bg-light">

<header th:replace="~{fragments/customer/header::header}"></header>

<div class="container mt-4 mb-5">
    <div class="row g-4">

        <div th:replace="~{fragments/customer/menu::menu}"></div>

        <div class="col-lg-9">

            <div class="bg-white rounded shadow-sm p-3 mb-4 d-flex align-items-center">
                <h4 class="m-0 fw-bold text-custom-blue">
                    <i class="fa-solid fa-magnifying-glass me-2 text-warning"></i>
                    Kết quả tìm kiếm cho: <span class="text-danger" th:text="${keyword}">Từ khóa</span>
                </h4>
            </div>

            <div th:if="${#lists.isEmpty(productList)}" class="alert alert-warning text-center shadow-sm py-5">
                <i class="fa-solid fa-box-open fs-1 mb-3 text-muted"></i>
                <p class="fs-5 mb-0">Xin lỗi, hiện chưa có sản phẩm nào thuộc danh mục này.</p>
                <a href="/" class="btn btn-outline-primary mt-3">Quay lại Trang chủ</a>
            </div>

            <div th:unless="${#lists.isEmpty(productList)}" class="row g-3">
                <div class="col-lg-4 col-md-6" th:each="p : ${productList}">
                    <div class="card h-100 shadow-sm border-0 product-card">

                        <a th:href="@{/product/detail(id=${p.id})}" class="text-decoration-none text-dark d-flex flex-column h-100">
                            <img th:src="${p.mainImage != null ? p.mainImage : 'https://via.placeholder.com/300x300?text=NO+IMAGE'}"
                                 class="card-img-top p-3" alt="Hình sản phẩm">

                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title fw-bold mb-3" th:text="${p.name}">Tên sản phẩm</h6>

                                <p class="text-danger fw-bold fs-5 mb-0 mt-auto">
                                    Giá: Xem chi tiết
                                </p>
                            </div>
                        </a>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<div th:replace="~{fragments/customer/footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
