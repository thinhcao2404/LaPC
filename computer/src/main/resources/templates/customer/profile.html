<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản - THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/profile.css}"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<header th:replace="~{fragments/header::header}"></header>

<div class="container">
    <div class="profile-container">
        <h3 class="fw-bold mb-4 text-center">Thông tin cá nhân</h3>

        <form th:action="@{/profile/update}" method="post" th:object="${customer}">
            <div class="mb-3">
                <label class="form-label">Họ tên</label>
                <input type="text" th:field="*{fullName}" class="form-control form-control-profile" placeholder="Nhập họ tên của bạn..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text" th:field="*{phone}" class="form-control form-control-profile" placeholder="Nhập số điện thoại di động..." required>
            </div>

            <div class="mb-4">
                <label class="form-label">Địa chỉ nhận hàng</label>
                <textarea th:field="*{address}" class="form-control form-control-profile" rows="3" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..."></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-change">THAY ĐỔI</button>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer::footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        var successMessage = /*[[${successMessage}]]*/ null;


        if (successMessage) {
            Swal.fire({
                icon: 'success',
                title: 'Thành công!',
                text: successMessage,
                timer: 2500,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }
    });
</script>
</body>
</html>
