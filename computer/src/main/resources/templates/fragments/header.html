<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - Cửa hàng Máy Tính</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="/js/cart.js"></script>
</head>
<header th:fragment="header" class="bg-custom-blue text-white py-3">
    <div class="container d-flex align-items-center justify-content-between">
        <a href="/" class="text-white text-decoration-none fw-bold fs-3">
            <i class="fa-solid fa-computer"></i> THỊNH PC
        </a>

        <div class="input-group search-bar w-40" style="max-width: 500px;">
            <form th:action="@{/search}" method="get" class="input-group search-bar w-40" style="max-width: 500px;">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control px-4" placeholder="Nhập từ khóa tìm kiếm..." required>

                <button class="btn btn-light px-4" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>

        <div class="d-flex align-items-center gap-4">

            <a th:href="@{/cart}" class="text-white text-decoration-none text-center" style="font-size: 0.85rem;">
                <i class="fa-solid fa-cart-shopping fs-5 mb-1 position-relative">
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              id="cartBadge"
              style="font-size: 0.6rem;"
              th:text="${calculatedTotal != null ? calculatedTotal : 0}">0</span>

                </i><br>Giỏ Hàng
            </a>

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-outline-light rounded-pill px-3">
                    <i class="fa-solid fa-user me-1"></i> Đăng nhập
                </a>
            </div>
            <div sec:authorize="isAuthenticated()" class="dropdown">
                <button class="btn btn-warning rounded-pill px-3 dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown">
                    Xin chào, <span sec:authentication="name">Khách</span>!
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-3 p-2" style="min-width: 200px; border-radius: 12px;">
                    <li>
                        <a class="dropdown-item py-2 d-flex align-items-center" th:href="@{/profile}">
                            <i class="fa-regular fa-user me-3 fs-5 text-secondary"></i>
                            <span>Thông tin tài khoản</span>
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item py-2 d-flex align-items-center" th:href="@{/order}">
                            <i class="fa-solid fa-list-ul me-3 fs-5 text-secondary"></i>
                            <span>Danh sách đơn hàng</span>
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item py-2 d-flex align-items-center" th:href="@{/change-password}">
                            <i class="fa-solid fa-key me-3 fs-5 text-secondary"></i>
                            <span>Đổi mật khẩu</span>
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item py-2 d-flex align-items-center text-danger fw-bold">
                                <i class="fa-solid fa-right-from-bracket me-3"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
</html>
