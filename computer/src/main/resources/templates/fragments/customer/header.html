<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="header" class="bg-custom-blue text-white py-3 shadow-sm">
    <div class="container">
        <div class="row align-items-center g-2 g-md-3">

            <div class="col-6 col-lg-3 order-1 d-flex align-items-center">
                <button class="btn btn-link text-white d-lg-none me-2 p-0 text-decoration-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
                    <i class="fa-solid fa-bars fs-3"></i>
                </button>
                <a href="/" class="text-white text-decoration-none fw-bold fs-3">
                    <i class="fa-solid fa-computer"></i> LaPC
                </a>
            </div>

            <div class="col-12 col-lg-6 order-3 order-lg-2 mt-3 mt-lg-0">
                <form th:action="@{/search}" method="get" class="input-group shadow-sm rounded-pill overflow-hidden">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control px-4 border-0 py-2" placeholder="Nhập từ khóa tìm kiếm..." required>
                    <button class="btn btn-light px-4 border-0" type="submit">
                        <i class="fa-solid fa-magnifying-glass text-primary"></i>
                    </button>
                </form>
            </div>

            <div class="col-6 col-lg-3 order-2 order-lg-3 d-flex justify-content-end align-items-center gap-3">

                <a th:href="@{/cart}" class="text-white text-decoration-none text-center d-flex flex-column align-items-center mt-1">
                    <i class="fa-solid fa-cart-shopping fs-5 position-relative">
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm"
                              id="cartBadge" style="font-size: 0.65rem;"
                              th:text="${calculatedTotal != null ? calculatedTotal : 0}">0</span>
                    </i>
                    <span class="d-none d-sm-block mt-1" style="font-size: 0.8rem;">Giỏ Hàng</span>
                </a>

                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline-light rounded-pill px-3 py-2 d-flex align-items-center">
                        <i class="fa-solid fa-user"></i>
                        <span class="d-none d-sm-inline ms-2">Đăng nhập</span>
                    </a>
                </div>

                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-warning rounded-pill px-3 py-2 dropdown-toggle fw-bold d-flex align-items-center text-dark" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-circle-user fs-5"></i>
                        <span class="d-none d-sm-inline ms-2" sec:authentication="name">Khách</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-3 p-2" style="min-width: 220px; border-radius: 12px;">
                        <li><a class="dropdown-item py-2 d-flex align-items-center" th:href="@{/profile}"><i class="fa-regular fa-user me-3 fs-5 text-secondary"></i><span>Thông tin tài khoản</span></a></li>
                        <li><a class="dropdown-item py-2 d-flex align-items-center" th:href="@{/order}"><i class="fa-solid fa-list-ul me-3 fs-5 text-secondary"></i><span>Danh sách đơn hàng</span></a></li>
                        <li><a class="dropdown-item py-2 d-flex align-items-center" th:href="@{/change-password}"><i class="fa-solid fa-key me-3 fs-5 text-secondary"></i><span>Đổi mật khẩu</span></a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item py-2 d-flex align-items-center text-danger fw-bold"><i class="fa-solid fa-right-from-bracket me-3"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <div class="offcanvas offcanvas-start bg-light" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
        <div class="offcanvas-header bg-custom-blue text-white">
            <h5 class="offcanvas-title fw-bold" id="mobileMenuLabel"><i class="fa-solid fa-bars me-2"></i> DANH MỤC</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body p-0">
            <div class="accordion accordion-flush" id="accordionMobileMenu">

                <div class="accordion-item" th:each="cat : ${categoryList}">
                    <h2 class="accordion-header" th:id="'heading-' + ${cat.id}">
                        <button class="accordion-button collapsed py-3 fw-medium" type="button"
                                data-bs-toggle="collapse"
                                th:data-bs-target="'#collapse-' + ${cat.id}"
                                aria-expanded="false"
                                th:aria-controls="'collapse-' + ${cat.id}">
                            <i class="fa-solid fa-desktop me-3 text-secondary"></i>
                            <span th:text="${cat.name}">Tên danh mục</span>
                        </button>
                    </h2>

                    <div th:id="'collapse-' + ${cat.id}" class="accordion-collapse collapse"
                         th:aria-labelledby="'heading-' + ${cat.id}"
                         data-bs-parent="#accordionMobileMenu">
                        <div class="accordion-body bg-white border-bottom">

                            <h6 class="fw-bold mb-3 text-dark" style="font-size: 0.85rem;" th:text="'Hãng ' + ${cat.name}">Hãng</h6>

                            <div class="d-flex flex-wrap gap-2">
                                <a th:each="b : ${cat.brands}"
                                   th:href="@{'/category/' + ${cat.id} + '?brand=' + ${b.id}}"
                                   class="badge bg-light text-dark border text-decoration-none py-2 px-3 brand-btn"
                                   th:text="${b.name}">
                                    Asus
                                </a>

                                <a th:href="@{'/category/' + ${cat.id}}"
                                   class="badge bg-primary text-white text-decoration-none py-2 px-3 brand-btn">
                                    Xem tất cả
                                </a>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</header>
</html>
