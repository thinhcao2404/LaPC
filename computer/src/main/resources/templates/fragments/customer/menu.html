<div th:fragment="menu" class="col-lg-3 col-md-4 d-none d-lg-block">
    <div class="bg-white rounded shadow-sm category-sidebar h-100 py-2 position-relative z-3">
        <h6 class="fw-bold px-3 pt-2 pb-2 border-bottom text-custom-blue">DANH MỤC SẢN PHẨM</h6>

        <div class="category-item" th:each="cat : ${categoryList}">

            <a th:href="@{'/category/' + ${cat.id}}" class="d-flex align-items-center px-3 py-2 text-dark text-decoration-none category-link">
                <i class="fa-solid fa-desktop me-2 text-secondary"></i>
                <span th:text="${cat.name}" class="flex-grow-1 fw-medium" style="font-size: 0.9rem;">Laptop</span>
                <i class="fa-solid fa-chevron-right text-muted" style="font-size: 0.75rem;"></i>
            </a>

            <div class="sub-menu-wrapper">
                <div class="sub-menu-panel bg-white shadow rounded border p-3">
                    <h6 class="fw-bold mb-3 pb-2 border-bottom text-dark" th:text="'Hãng ' + ${cat.name}">Hãng Laptop</h6>

                    <div class="d-flex flex-wrap gap-2">
                        <a th:each="b : ${cat.brands}"
                           th:href="@{'/category/' + ${cat.id} + '?brand=' + ${b.id}}"
                           class="badge bg-light text-dark border text-decoration-none p-2 brand-btn"
                           th:text="${b.name}">
                            Asus
                        </a>

                        <a th:href="@{'/category/' + ${cat.id}}" class="badge bg-primary text-white text-decoration-none p-2 brand-btn">
                            Xem tất cả
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
