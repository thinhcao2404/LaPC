<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản phẩm - Admin THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/product-admin.css}">
</head>
<body>

<div class="d-flex">
    <div class="sidebar text-white" style="width: 250px;">
        <h4 class="text-center py-4 mb-0 fw-bold border-bottom border-secondary">
            <i class="fa-solid fa-desktop text-info me-2"></i>THỊNH PC
        </h4>
        <div th:replace="~{admin/dashboard::menu}"></div>
    </div>

    <div class="flex-grow-1 p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-dark m-0"><i class="fa-solid fa-boxes-stacked me-2"></i> Danh sách Sản phẩm</h3>
            <a th:href="@{/admin/products/add}" class="btn btn-primary fw-bold shadow-sm">
                <i class="fa-solid fa-plus me-2"></i>Thêm sản phẩm mới
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="py-3 px-4 text-center">ID</th>
                        <th>Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Thương hiệu</th>
                        <th>Giá bán</th>
                        <th class="text-end px-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td class="text-center fw-bold text-muted px-4" th:text="${product.id}"></td>

                        <td>
                            <img th:src="${product.mainImage != null and !product.mainImage.isEmpty() ? product.mainImage : 'https://via.placeholder.com/60?text=No+Image'}"
                                 class="product-img border shadow-sm" alt="Product Image">
                        </td>

                        <td class="fw-bold text-dark" th:text="${product.name}"></td>

                        <td>
                            <span class="badge bg-secondary" th:text="${product.brand != null ? product.brand.name : 'Chưa có'}"></span>
                        </td>

                        <td class="text-danger fw-bold">
                      <span th:if="${not #lists.isEmpty(product.variants)}"
          th:text="${#numbers.formatDecimal(product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>

                            <span th:if="${#lists.isEmpty(product.variants)}" class="text-muted small fw-normal">
        <i class="fa-solid fa-circle-exclamation me-1"></i>Chưa nhập giá
    </span>
                        </td>

                        <td class="text-end px-4">
                            <a th:href="@{/admin/products/edit(id=${product.id})}" class="btn btn-sm btn-warning text-dark me-1" title="Sửa sản phẩm">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>

                            <form th:action="@{/admin/products/delete}" method="post" class="d-inline-block" onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?');">
                                <input type="hidden" name="id" th:value="${product.id}">
                                <button type="submit" class="btn btn-sm btn-danger" title="Xóa sản phẩm">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-box-open fs-1 mb-3"></i>
                            <h5>Chưa có sản phẩm nào trong kho!</h5>
                            <a th:href="@{/admin/products/add}" class="btn btn-outline-primary mt-2">Thêm sản phẩm đầu tiên</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
