<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng #[[${order.id}]] - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/product-detail-admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin/sidebar.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/admin/menu :: menu('orders')}"></div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-dark m-0">
                <a href="/admin/orders" class="text-secondary text-decoration-none me-2"><i class="fa-solid fa-arrow-left"></i></a>
                Chi tiết đơn hàng #<span th:text="${order.id}"></span>
            </h4>

            <span class="badge fs-6 px-3 py-2"
                  th:classappend="${order.status == 'PENDING' ? 'bg-warning text-dark' :
                                  (order.status == 'SHIPPING' ? 'bg-info text-white' :
                                  (order.status == 'COMPLETED' ? 'bg-success text-white' : 'bg-danger text-white'))}"
                  th:text="${order.status == 'PENDING' ? 'Chờ xác nhận' :
                           (order.status == 'SHIPPING' ? 'Đang giao hàng' :
                           (order.status == 'COMPLETED' ? 'Đã giao thành công' : 'Đã hủy'))}">
            </span>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3 fw-bold"><i class="fa-solid fa-user me-2"></i>Thông tin nhận hàng</div>
                    <div class="card-body">
                        <p class="mb-2"><strong>Người nhận:</strong> <span th:text="${order.customerName}"></span></p>
                        <p class="mb-2"><strong>Điện thoại:</strong> <span th:text="${order.shippingPhone}"></span></p>
                        <p class="mb-2"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
                        <p class="mb-0"><strong>Ghi chú:</strong> <span class="text-danger" th:text="${order.note != null ? order.note : 'Không có'}"></span></p>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 fw-bold"><i class="fa-solid fa-gear me-2"></i>Thao tác</div>
                    <div class="card-body d-grid gap-2">
                        <form th:if="${order.status == 'PENDING'}" th:action="@{/admin/update-order-status}" method="post">
                            <input type="hidden" name="id" th:value="${order.id}">
                            <input type="hidden" name="newStatus" value="SHIPPING">
                            <button type="submit" class="btn btn-info text-white w-100 fw-bold">
                                <i class="fa-solid fa-truck-fast me-2"></i> Giao hàng ngay
                            </button>
                        </form>

                        <form th:if="${order.status == 'SHIPPING'}" th:action="@{/admin/update-order-status}" method="post">
                            <input type="hidden" name="id" th:value="${order.id}">
                            <input type="hidden" name="newStatus" value="COMPLETED">
                            <button type="submit" class="btn btn-success text-white w-100 fw-bold">
                                <i class="fa-solid fa-check me-2"></i> Xác nhận Đã giao
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 fw-bold"><i class="fa-solid fa-box-open me-2"></i>Sản phẩm đã đặt</div>
                    <div class="card-body p-0">
                        <table class="table table-borderless align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">Sản phẩm</th>
                                <th>Đơn giá</th>
                                <th>SL</th>
                                <th class="text-end pe-4">Thành tiền</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="detail : ${order.orderDetails}" class="border-bottom">
                                <td class="ps-4 d-flex align-items-center py-3">
                                    <img th:src="${detail.variants.product.mainImage != null ? detail.variants.product.mainImage : 'https://via.placeholder.com/50'}" class="rounded border me-3" style="width: 50px; height: 50px; object-fit: contain;">
                                    <div>
                                        <h6 class="mb-0 fw-bold" th:text="${detail.variants.product.name}"></h6>
                                        <small class="text-muted">
                                            <span th:each="attr, stat : ${detail.variants.attributes}" th:text="${attr.value} + (!${stat.last} ? ' - ' : '')"></span>
                                        </small>
                                    </div>
                                </td>
                                <td th:text="${#numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></td>
                                <td th:text="${detail.quantity}"></td>
                                <td class="text-end pe-4 fw-bold text-danger" th:text="${#numbers.formatDecimal(detail.price * detail.quantity, 0, 'COMMA', 0, 'POINT')} + '₫'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer bg-white text-end py-3 px-4">
                        <h5 class="m-0">Tổng cộng: <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'"></span></h5>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
