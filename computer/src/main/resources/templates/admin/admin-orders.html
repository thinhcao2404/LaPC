<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đơn hàng - Admin THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/order-admin.css}">
</head>
<body>

<div class="d-flex">

    <div class="sidebar text-white" style="width: 250px;">
        <h4 class="text-center py-4 mb-0 fw-bold border-bottom border-secondary">
            <i class="fa-solid fa-desktop text-info me-2"></i>THỊNH PC
        </h4>
        <div th:replace="~{admin/dashboard::menu}"></div>
    </div>

    <div class="flex-grow-1 p-4">

        <div class="d-flex align-items-center mb-4">
            <h3 class="fw-bold mb-0"><i class="fa-solid fa-list-check me-2"></i> Danh sách tất cả đơn hàng</h3>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="py-3 px-4">Mã Đơn</th>
                        <th>Ngày Đặt</th>
                        <th>Khách Hàng</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th class="text-end px-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-bold px-4">#<span th:text="${order.id}"></span></td>
                        <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <div class="fw-bold" th:text="${order.customerName}"></div>
                            <div class="text-muted small" th:text="${order.shippingPhone}"></div>
                        </td>
                        <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${order.status == 'PENDING' ? 'bg-warning text-dark' :
                                                  (order.status == 'SHIPPING' ? 'bg-info text-white' :
                                                  (order.status == 'COMPLETED' ? 'bg-success text-white' : 'bg-danger text-white'))}"
                                  th:text="${order.status == 'PENDING' ? 'Chờ xác nhận' :
                                           (order.status == 'SHIPPING' ? 'Đang giao hàng' :
                                           (order.status == 'COMPLETED' ? 'Đã giao' : 'Đã hủy'))}">
                            </span>
                        </td>

                        <td class="text-end px-4">
                            <a th:href="@{/admin/order-detail(id=${order.id})}" class="btn btn-sm btn-outline-primary" title="Xem chi tiết">
                                <i class="fa-solid fa-eye"></i>
                            </a>

                            <form th:if="${order.status == 'PENDING'}" th:action="@{/admin/update-order-status}" method="post" class="d-inline-block ms-1">
                                <input type="hidden" name="id" th:value="${order.id}">
                                <input type="hidden" name="newStatus" value="SHIPPING">
                                <button type="submit" class="btn btn-sm btn-info text-white" title="Duyệt đơn & Giao hàng">
                                    <i class="fa-solid fa-truck-fast"></i>
                                </button>
                            </form>

                            <form th:if="${order.status == 'SHIPPING'}" th:action="@{/admin/update-order-status}" method="post" class="d-inline-block ms-1">
                                <input type="hidden" name="id" th:value="${order.id}">
                                <input type="hidden" name="newStatus" value="COMPLETED">
                                <button type="submit" class="btn btn-sm btn-success text-white" title="Xác nhận đã giao">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-folder-open fs-1 mb-3"></i>
                            <h5>Chưa có đơn hàng nào trong hệ thống!</h5>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
