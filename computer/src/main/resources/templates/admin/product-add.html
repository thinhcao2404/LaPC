<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản phẩm - Admin THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script th:src="@{/js/cproduct.js}"></script>
    <link rel="stylesheet" th:href="@{/css/admin/product-add.css}">
    <link rel="stylesheet" th:href="@{/css/admin/sidebar.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/admin/menu :: menu('products')}"></div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex align-items-center mb-4">
            <a href="/admin/products" class="text-secondary text-decoration-none me-2"><i class="fa-solid fa-arrow-left"></i></a>
            <h3 class="fw-bold mb-0">Thêm Sản phẩm mới</h3>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span class="fw-bold" th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <form th:action="@{/admin/products/add}" th:object="${product}" method="post">
            <div class="row">
                <div class="col-md-5">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white fw-bold py-3"><i class="fa-solid fa-laptop me-2"></i>Thông tin chung</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Tên máy tính *</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Thương hiệu</label>
                                <select name="brand" class="form-select">
                                    <option value="">-- Chọn thương hiệu --</option>
                                    <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Danh mục</label>
                                <select name="category" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Link Ảnh chính (URL)</label>
                                <input type="text" th:field="*{mainImage}" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Mô tả sản phẩm</label>
                                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <span class="fw-bold"><i class="fa-solid fa-microchip me-2"></i>Các cấu hình (Biến thể)</span>
                            <button type="button" class="btn btn-sm btn-success" onclick="addVariantRow()">
                                <i class="fa-solid fa-plus me-1"></i> Thêm cấu hình
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-borderless align-middle m-0">
                                <thead class="table-light">
                                <tr>
                                    <th style="width: 25%;">Mã SKU</th>
                                    <th style="width: 35%;">Các thuộc tính động</th>
                                    <th style="width: 20%;">Giá bán</th>
                                    <th style="width: 15%;">Tồn kho</th>
                                    <th style="width: 5%;">Xóa</th>
                                </tr>
                                </thead>
                                <tbody id="variants-body">
                                <tr>
                                    <td><input type="text" th:field="*{variants[0].sku}" class="form-control" placeholder="VD: SKU-01" required></td>

                                    <td>
                                        <div id="attrs-0">
                                            <div class="d-flex mb-1">
                                                <input type="text" name="variants[0].attributes[0].name" class="form-control form-control-sm me-1" placeholder="Tên (VD: RAM)">
                                                <input type="text" name="variants[0].attributes[0].value" class="form-control form-control-sm" placeholder="Giá trị (VD: 16GB)">
                                            </div>
                                        </div>
                                        <button type="button" class="btn btn-sm btn-outline-secondary py-0 mt-1" onclick="addAttribute(0)">
                                            <i class="fa-solid fa-plus me-1"></i>Thêm thuộc tính
                                        </button>
                                    </td>

                                    <td><input type="number" th:field="*{variants[0].price}" class="form-control" required></td>
                                    <td><input type="number" th:field="*{variants[0].stock}" class="form-control"></td>
                                    <td></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold px-5 shadow-sm">
                            <i class="fa-solid fa-floppy-disk me-2"></i> LƯU SẢN PHẨM
                        </button>
                    </div>
                </div>
            </div>
        </form>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
