<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Tài khoản - Admin THỊNH PC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #343a40; }
        .sidebar a { color: #c2c7d0; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="d-flex">
    <div class="sidebar text-white" style="width: 250px;">
        <h4 class="text-center py-4 mb-0 fw-bold border-bottom border-secondary">
            <i class="fa-solid fa-desktop text-info me-2"></i>THỊNH PC
        </h4>
        <div th:replace="~{admin/dashboard::menu}"></div>
    </div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Quản lý Tài khoản</h3>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ tên</th>
                        <th>SĐT</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="acc : ${accounts}">
                        <td class="ps-4 fw-bold" th:text="${acc.id}"></td>

                        <td th:text="${acc.username}"></td>

                        <td th:text="${acc.customer != null ? acc.customer.fullName : 'Chưa cập nhật'}"></td>

                        <td>
                            <small class="text-muted" th:text="${acc.customer != null ? acc.customer.phone : ''}"></small>
                        </td>

                        <td>
                            <span th:each="r : ${acc.roles}" class="badge bg-info text-dark me-1" th:text="${r.name}"></span>
                        </td>

                        <td>
                            <span class="badge bg-success">Hoạt động</span>
                        </td>

                        <td class="text-end pe-4">
                            <form th:action="@{/admin/accounts/toggle-status}" method="post" class="d-inline-block">
                                <input type="hidden" name="id" th:value="${acc.id}">

                                <button th:if="${acc.active}" type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Bạn có chắc chắn muốn KHÓA tài khoản này? Người dùng sẽ không thể đăng nhập.');" title="Khóa tài khoản">
                                    <i class="fa-solid fa-lock"></i> Khóa
                                </button>

                                <button th:unless="${acc.active}" type="submit" class="btn btn-sm btn-outline-success"
                                        onclick="return confirm('Bạn muốn MỞ KHÓA cho tài khoản này?');" title="Mở khóa">
                                    <i class="fa-solid fa-unlock"></i> Mở khóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(accounts)}">
                        <td colspan="7" class="text-center py-4 text-muted">Chưa có tài khoản nào trên hệ thống.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
