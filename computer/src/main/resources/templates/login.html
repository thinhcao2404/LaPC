<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow rounded-4 border-0 p-4">
        <h2 class="text-center text-primary fw-bold mb-4">🔐 Đăng nhập</h2>

        <div th:if="${param.success}" class="alert alert-success text-center">
            Đăng ký thành công! Vui lòng đăng nhập.
        </div>

        <div th:if="${param.error}" class="alert alert-danger text-center">
            Tên đăng nhập hoặc mật khẩu không đúng!
        </div>

        <div th:if="${param.logout}" class="alert alert-info text-center">
            Bạn đã đăng xuất thành công.
        </div>
        <div th:if="${param.looked}" class="alert alert-warning">
            Tài khoản của bạn đã bị khóa!
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập:</label>
                <input type="text" class="form-control" name="username" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu:</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Đăng nhập</button>

            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Ghi nhớ tài khoản</label>
            </div>
            <div class="text-center mt-3">
                Nếu chưa có tài khoản. <a th:href="@{/register}" class="text-decoration-none">Đăng ký</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
